name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          which cargo
          cargo --version
          xcodebuild -version

      - name: Download prepared assets (private repo)
        env:
          GH_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: |
          mkdir -p .local/horizon-client
          gh release download assets --repo ItzAdr1x/horizon-assets \
            --pattern horizon-assets.zip --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/horizon-assets.zip" -d .local/horizon-client
          test -f .local/horizon-client/26.3/horizon-resources.json

      - name: Build IPA
        run: packaging/ios/package.sh device .local/horizon-client/26.3 .local/ios

      - name: Upload IPA to the private repo
        env:
          GH_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: |
          gh release delete ipa --repo ItzAdr1x/horizon-assets --cleanup-tag --yes || true
          gh release create ipa .local/ios/device/Horizon.ipa \
            --repo ItzAdr1x/horizon-assets \
            --title "Horizon IPA" \
            --notes "Built by workflow run ${{ github.run_id }}"
